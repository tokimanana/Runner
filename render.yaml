services:
  - type: web
    name: runner-backend
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: NODE_ENV=development npm install && npx prisma generate && npx nx build backend --configuration=production
    startCommand: npx prisma migrate deploy && node dist/apps/backend/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1d
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
    buildFilter:
      paths:
        - apps/backend/**
        - prisma/**
        - libs/**
        - package.json
        - package-lock.json
        - nx.json
        - tsconfig.base.json
      ignoredPaths:
        - '**/*.md'
        - '**/*.spec.ts'

  - type: web
    name: runner-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    buildCommand: NODE_ENV=development npm install && npx nx build frontend --configuration=production
    staticPublishPath: dist/apps/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - apps/frontend/**
        - libs/**
        - package.json
        - package-lock.json
        - nx.json
        - tsconfig.base.json
      ignoredPaths:
        - '**/*.md'
        - '**/*.spec.ts'
