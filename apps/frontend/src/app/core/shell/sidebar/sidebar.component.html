<div
  class="sidebar-wrapper"
  [class.pinned]="isPinned()"
  [class.expanded]="isExpanded()"
>
  @if (isExpanded() && !isPinned()) {
    <div class="sidebar-backdrop" (click)="collapse()"></div>
  }

  <aside
    class="sidebar"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
  >
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <i class="pi pi-send logo-icon"></i>
        <span class="sidebar-logo-text">Runner</span>
      </div>
      <button
        class="pin-btn"
        [class.active]="isPinned()"
        (click)="togglePin()"
        [pTooltip]="isPinned() ? 'Unpin' : 'Pin'"
        tooltipPosition="right"
      >
        <i
          class="pi"
          [class.pi-thumbtack]="!isPinned()"
          [class.pi-times]="isPinned()"
        ></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        @if (userRole$ | async; as role) {
          @if (item.roles.includes(role)) {
            <a
              [routerLink]="item.route"
              routerLinkActive="active-link"
              class="nav-item"
              [pTooltip]="!isExpanded() && !isPinned() ? item.label : ''"
              tooltipPosition="right"
            >
              <span class="nav-icon"><i [class]="item.icon"></i></span>
              <span class="nav-label">{{ item.label }}</span>
              <span class="active-indicator"></span>
            </a>
          }
        }
      }
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-divider"></div>
      <button class="nav-item toggle-btn" (click)="togglePin()">
        <span class="nav-icon">
          <i
            class="pi"
            [class.pi-lock-open]="!isPinned()"
            [class.pi-lock]="isPinned()"
          ></i>
        </span>
        <span class="nav-label">{{ isPinned() ? 'Pinned' : 'Auto-hide' }}</span>
      </button>
    </div>
  </aside>
</div>
