<div
  class="sidebar-wrapper"
  [class.pinned]="isPinned()"
  [class.expanded]="isExpanded()"
>
  @if (isExpanded() && !isPinned()) {
    <div class="sidebar-backdrop" (click)="collapse()"></div>
  }

  <aside
    class="sidebar"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
  >
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <i class="pi pi-send logo-icon"></i>
        <span class="sidebar-logo-text">Runner</span>
      </div>
      <button
        class="pin-btn"
        [class.active]="isPinned()"
        (click)="togglePin()"
        [pTooltip]="isPinned() ? 'Unpin sidebar' : 'Pin sidebar'"
        tooltipPosition="right"
      >
        <span class="pin-dot"></span>
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        @if (userRole$ | async; as role) {
          @if (item.roles.includes(role)) {
            <a
              [routerLink]="item.route"
              routerLinkActive="active-link"
              class="nav-item"
              [pTooltip]="!isExpanded() && !isPinned() ? item.label : ''"
              tooltipPosition="right"
            >
              <span class="nav-icon"><i [class]="item.icon"></i></span>
              <span class="nav-label">{{ item.label }}</span>
              <span class="active-indicator"></span>
            </a>
          }
        }
      }
    </nav>
  </aside>
</div>
