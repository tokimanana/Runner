<div class="seasons-list-page">
  <div class="toolbar">
    <p-iconfield>
      <p-inputicon class="pi pi-search" />
      <input
        pInputText
        type="text"
        placeholder="Search seasons..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </p-iconfield>
    <p-button
      label="New Season"
      icon="pi pi-plus"
      (onClick)="startAddingNew()"
    />
  </div>

  <p-table [value]="filtered()" [loading]="loading()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Season Name</th>
        <th>Periods</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-season>
      <tr
        [routerLink]="['/management/seasons', season.id]"
        style="cursor: pointer"
      >
        <td>{{ season.name }}</td>
        <td>{{ season.seasonPeriods | periodCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-trash"
              [text]="true"
              [rounded]="true"
              size="small"
              severity="danger"
              (onClick)="confirmDelete(season); $event.stopPropagation()"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="footer">
      @if (isAddingNew()) {
        <tr>
          <td>
            <input
              pInputText
              [formControl]="nameControl"
              placeholder="Season name"
              [readonly]="isSubmitting()"
              (keyup.enter)="saveNewSeason()"
            />
            @if (nameControl.invalid && nameControl.touched) {
              <small class="error">Name is required</small>
            }
          </td>
          <td>—</td>
          <td>
            <div class="row-actions">
              <p-button
                icon="pi pi-check"
                [text]="true"
                [rounded]="true"
                size="small"
                [loading]="isSubmitting()"
                (onClick)="saveNewSeason()"
              />
              <p-button
                icon="pi pi-times"
                [text]="true"
                [rounded]="true"
                size="small"
                severity="secondary"
                [disabled]="isSubmitting()"
                (onClick)="cancelAddNew()"
              />
            </div>
          </td>
        </tr>
      }
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">
          <div class="empty-state">
            <i class="pi pi-inbox"></i>
            <span>No seasons configured yet.</span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-confirmDialog />
