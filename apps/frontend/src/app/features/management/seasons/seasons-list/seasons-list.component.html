<div class="seasons-list">
  <div class="list-toolbar">
    <div class="list-header">
      <h2 class="list-title">Seasons</h2>
      <span class="list-subtitle">
        {{ (seasons$ | async)?.length ?? 0 }} seasons configured
      </span>
    </div>
    <p-button
      label="Add season"
      icon="pi pi-plus"
      [routerLink]="['/management/seasons/create']"
    />
  </div>

  <p-table
    [value]="(seasons$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template #header>
      <tr>
        <th>Season Name</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-season>
      <tr>
        <td>{{ season.name }}</td>
        <td>{{ season.startDate | date:'dd/MM/yyyy' }}</td>
        <td>{{ season.endDate | date:'dd/MM/yyyy' }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              severity="secondary"
              [routerLink]="['/management/seasons', season.id, 'edit']"
            />
            <p-button
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              (onClick)="confirmDelete(season)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5" class="empty-state">No seasons configured yet.</td>
      </tr>
    </ng-template>
  </p-table>

  <div class="list-footer">
    <span>Showing {{ (seasons$ | async)?.length ?? 0 }} seasons</span>
  </div>
</div>

<p-confirmdialog />
