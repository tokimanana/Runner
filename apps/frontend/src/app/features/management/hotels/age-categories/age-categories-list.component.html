<p-card>
  <ng-template pTemplate="header">
    <div class="flex align-items-center justify-content-between px-4 pt-4">
      <div class="flex align-items-center gap-2">
        <i class="pi pi-users text-xl text-color-secondary"></i>
        <span class="text-xl font-semibold">Age Categories</span>
      </div>
      <p-button
        label="Add Category"
        icon="pi pi-plus"
        (onClick)="addCategory.emit()"
        [disabled]="loading()"
      />
    </div>
  </ng-template>

  @if (loading()) {
    <p-progressBar
      mode="indeterminate"
      styleClass="mb-3"
      [style]="{ height: '3px' }"
    />
  }

  <p-table
    [value]="categories()"
    [loading]="loading()"
    styleClass="p-datatable-sm p-datatable-striped"
    [tableStyle]="{ 'min-width': '30rem' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Category</th>
        <th>Min Age</th>
        <th>Max Age</th>
        <th class="text-right">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-category>
      <tr>
        <td class="font-medium">{{ category.name }}</td>
        <td>{{ category.minAge }}</td>
        <td>{{ category.maxAge }}</td>
        <td>
          <div class="flex justify-content-end">
            <p-button
              icon="pi pi-pencil"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              (onClick)="editCategory.emit(category)"
              pTooltip="Edit"
              tooltipPosition="top"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td colspan="4">
          <div
            class="flex flex-column align-items-center gap-2 py-5 text-color-secondary"
          >
            <i class="pi pi-inbox text-4xl"></i>
            <span>No age categories defined yet.</span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
