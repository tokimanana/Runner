<p-dialog
  [(visible)]="visible"
  (onHide)="onDialogHide()"
  [header]="isEditMode() ? 'Edit Meal Plan' : 'New Meal Plan'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '40rem' }"
  (onHide)="onDialogHide()"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <div class="field">
        <label for="code">Code <span class="required">*</span></label>
        <input
          pInputText
          id="code"
          formControlName="code"
          class="w-full"
          placeholder="e.g. BB, HB, AI"
          autocomplete="off"
        />
        @if (form.controls.code.invalid && form.controls.code.touched) {
          <small class="error">Code is required</small>
        }
      </div>
      <div class="field">
        <label for="name">Name <span class="required">*</span></label>
        <input
          pInputText
          id="name"
          formControlName="name"
          class="w-full"
          placeholder="e.g. Bed & Breakfast"
          autocomplete="off"
        />
        @if (form.controls.name.invalid && form.controls.name.touched) {
          <small class="error">Name is required</small>
        }
      </div>
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea
        pTextarea
        id="description"
        formControlName="description"
        class="w-full"
        rows="3"
        placeholder="Optional — describe what this meal plan includes"
        style="resize: vertical"
      ></textarea>
    </div>
  </form>

  <ng-template #footer>
    <div class="dialog-footer">
      <p-button
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        (onClick)="close()"
      />
      <p-button
        [label]="isEditMode() ? 'Save changes' : 'Create meal plan'"
        [loading]="isSubmitting()"
        (onClick)="submit()"
      />
    </div>
  </ng-template>
</p-dialog>
