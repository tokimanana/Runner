<div class="mealPlans-list">
  <div class="list-toolbar">
    <div class="list-header">
      <h2 class="list-title">Meal Plans</h2>
      <span class="list-subtitle">
        {{ (mealPlans$ | async)?.length ?? 0 }} properties configured
      </span>
    </div>
    <p-button
      label="Add meal plan"
      icon="pi pi-plus"
      (onClick)="onAddMealPlan()"
    />
  </div>

  <p-table
    [value]="(mealPlans$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template #header>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Description</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-mealPlan>
      <tr>
        <td>
          <span class="mealPlan-code">{{ mealPlan.code }}</span>
        </td>
        <td>{{ mealPlan.name }}</td>
        <td>{{ mealPlan.description }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              severity="secondary"
              (onClick)="onEditMealPlan(mealPlan)"
            />
            <p-button
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              (onClick)="confirmDelete(mealPlan)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="empty-state">No meal plan configured yet.</td>
      </tr>
    </ng-template>
  </p-table>

  <div class="list-footer">
    <span>Showing {{ (mealPlans$ | async)?.length ?? 0 }} meal plans</span>
  </div>
</div>

<app-meal-plans-form />

<p-toast />
